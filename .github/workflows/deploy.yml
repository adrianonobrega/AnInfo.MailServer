name: Deploy AnInfo MailServer

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: aninfo-mailserver-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build and Deploy
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      DEPLOY_DIR: /srv/aninfo/apps/AnInfo.MailServer
      IMAGE_NAME: aninfo-mailserver
      TEST_POSTGRES_CONTAINER: aninfo-mailserver-ci-postgres
      DOTNET_INSTALL_DIR: /home/adriano/.dotnet

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v6


      # ============================================================
      # CONFIGURAR .NET
      # Lê automaticamente a versão definida no global.json
      # ============================================================

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json


      # ============================================================
      # INFORMAÇÕES
      # ============================================================

      - name: Informações do deploy
        run: |
          echo "=============================================="
          echo " AnInfo MailServer - Deploy"
          echo "=============================================="
          echo "Servidor : $(hostname)"
          echo "Usuário  : $(whoami)"
          echo "Commit   : $GITHUB_SHA"
          echo "Branch   : $GITHUB_REF"
          echo "Data     : $(date)"
          echo "=============================================="


      # ============================================================
      # VALIDAR SERVIDOR
      # ============================================================

      - name: Validar ambiente do servidor
        run: |
          set -e

          echo "=============================================="
          echo "Validando ambiente..."
          echo "=============================================="

          echo ""
          echo "Docker:"
          docker info > /dev/null
          docker --version

          echo ""
          echo "Docker Compose:"
          docker compose version

          echo ""
          echo ".NET SDK:"
          dotnet --version

          echo ""
          echo ".NET SDKs disponíveis:"
          dotnet --list-sdks

          echo ""
          echo "rsync:"
          rsync --version | head -n 1

          echo ""
          echo "curl:"
          curl --version | head -n 1

          echo ""
          echo "Diretório de deploy:"
          test -d "$DEPLOY_DIR"

          echo ""
          echo "Arquivo .env:"
          test -f "$DEPLOY_DIR/.env"

          ENV_PERMISSION=$(stat -c "%a" "$DEPLOY_DIR/.env")

          if [ "$ENV_PERMISSION" != "600" ]; then
            echo ""
            echo "ERRO:"
            echo "$DEPLOY_DIR/.env deve possuir permissão 600."
            echo "Permissão atual: $ENV_PERMISSION"
            exit 1
          fi

          echo ".env OK - permissão 600"

          echo ""
          echo "Rede Docker compartilhada:"
          docker network inspect aninfo_shared > /dev/null

          echo "aninfo_shared OK"

          echo ""
          echo "=============================================="
          echo "Ambiente validado com sucesso."
          echo "=============================================="


      # ============================================================
      # RESTORE
      # ============================================================

      - name: Restaurar dependências
        run: |
          set -e

          dotnet restore AnInfo.MailServer.sln


      # ============================================================
      # POSTGRESQL TEMPORÁRIO PARA TESTES
      # ============================================================

      - name: Preparar PostgreSQL de testes
        run: |
          set -e

          echo "Removendo eventual PostgreSQL de testes antigo..."

          docker rm -f "$TEST_POSTGRES_CONTAINER" \
            2>/dev/null || true

          echo ""
          echo "Iniciando PostgreSQL temporário..."

          docker run -d \
            --name "$TEST_POSTGRES_CONTAINER" \
            -e POSTGRES_DB=aninfo_mail \
            -e POSTGRES_USER=aninfo \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:5433:5432 \
            postgres:17.10-bookworm

          echo ""
          echo "Aguardando PostgreSQL ficar disponível..."

          for i in $(seq 1 30); do

            if docker exec "$TEST_POSTGRES_CONTAINER" \
              pg_isready \
              -U aninfo \
              -d aninfo_mail \
              > /dev/null 2>&1; then

              echo ""
              echo "PostgreSQL de testes pronto."
              exit 0
            fi

            echo "Tentativa $i/30..."
            sleep 2
          done

          echo ""
          echo "ERRO: PostgreSQL de testes não ficou disponível."

          docker logs "$TEST_POSTGRES_CONTAINER" || true

          exit 1


      # ============================================================
      # TESTES
      # ============================================================

      - name: Executar testes
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5433;Database=aninfo_mail;Username=aninfo"
        run: |
          set -e

          echo "=============================================="
          echo "Executando testes..."
          echo "=============================================="

          dotnet test \
            tests/AnInfo.MailServer.Tests/AnInfo.MailServer.Tests.csproj \
            -c Release \
            --no-restore \
            --verbosity normal

          echo ""
          echo "=============================================="
          echo "Testes concluídos com sucesso."
          echo "=============================================="


      # ============================================================
      # REMOVER POSTGRESQL DE TESTES
      # Executa inclusive se os testes falharem
      # ============================================================

      - name: Remover PostgreSQL de testes
        if: always()
        run: |
          docker rm -f "$TEST_POSTGRES_CONTAINER" \
            2>/dev/null || true


      # ============================================================
      # DESCOBRIR VERSÃO ATUAL
      # ============================================================

      - name: Identificar versão anterior
        id: previous
        run: |
          set -e

          PREVIOUS_SHA=""

          if [ -f "$DEPLOY_DIR/.deployed-sha" ]; then
            PREVIOUS_SHA=$(cat "$DEPLOY_DIR/.deployed-sha")
          fi

          echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=============================================="

          if [ -n "$PREVIOUS_SHA" ]; then
            echo "Versão atualmente implantada:"
            echo "$PREVIOUS_SHA"
          else
            echo "Nenhuma versão anterior registrada."
            echo "Este será o primeiro deploy."
          fi

          echo "=============================================="


      # ============================================================
      # PRESERVAR COMPOSE ANTERIOR PARA ROLLBACK
      # ============================================================

      - name: Preservar configuração anterior
        run: |
          set -e

          mkdir -p "$DEPLOY_DIR/.rollback"

          if [ -f "$DEPLOY_DIR/docker-compose.yml" ]; then

            cp \
              "$DEPLOY_DIR/docker-compose.yml" \
              "$DEPLOY_DIR/.rollback/docker-compose.yml"

            echo "docker-compose.yml anterior preservado."

          else

            echo "Primeiro deploy."
            echo "Não existe docker-compose.yml anterior."

          fi


      # ============================================================
      # COPIAR NOVA VERSÃO
      # O .env NÃO É COPIADO NEM APAGADO
      # ============================================================

      - name: Atualizar arquivos de deploy
        run: |
          set -e

          echo "=============================================="
          echo "Atualizando arquivos"
          echo "=============================================="

          echo "Origem:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Destino:"
          echo "$DEPLOY_DIR"

          rsync -a \
            --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.deployed-sha' \
            --exclude '.previous-sha' \
            --exclude '.rollback/' \
            --exclude '**/bin/' \
            --exclude '**/obj/' \
            ./ "$DEPLOY_DIR/"

          echo ""
          echo "Arquivos atualizados."


      # ============================================================
      # BUILD DA IMAGEM VERSIONADA
      # ============================================================

      - name: Build da imagem
        working-directory: /srv/aninfo/apps/AnInfo.MailServer
        run: |
          set -e

          echo "=============================================="
          echo "Build Docker"
          echo "=============================================="

          echo "Imagem:"
          echo "$IMAGE_NAME:$GITHUB_SHA"

          MAILSERVER_IMAGE_TAG="$GITHUB_SHA" \
          docker compose \
            --env-file .env \
            build mailserver

          echo ""
          echo "Validando imagem criada..."

          docker image inspect \
            "$IMAGE_NAME:$GITHUB_SHA" \
            > /dev/null

          echo ""
          echo "Imagem criada com sucesso:"

          docker image inspect \
            "$IMAGE_NAME:$GITHUB_SHA" \
            --format '{{.RepoTags}}'


      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Subir nova versão
        id: deployment
        working-directory: /srv/aninfo/apps/AnInfo.MailServer
        run: |
          set -e

          echo "=============================================="
          echo "Deploy"
          echo "=============================================="

          echo "Subindo versão:"
          echo "$GITHUB_SHA"

          MAILSERVER_IMAGE_TAG="$GITHUB_SHA" \
          docker compose \
            --env-file .env \
            up -d \
            --no-build

          echo ""
          echo "Containers após deploy:"

          docker compose \
            --env-file .env \
            ps


      # ============================================================
      # HEALTH CHECK
      # ============================================================

      - name: Validar health check
        id: health
        working-directory: /srv/aninfo/apps/AnInfo.MailServer
        run: |
          set -e

          echo "=============================================="
          echo "Health Check"
          echo "=============================================="

          echo "Aguardando:"
          echo "http://127.0.0.1:8085/health"

          for i in $(seq 1 30); do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8085/health \
              > /dev/null; then

              echo ""
              echo "=============================================="
              echo " DEPLOY APROVADO"
              echo "=============================================="
              echo "Health check: OK"
              echo "Commit:"
              echo "$GITHUB_SHA"
              echo "=============================================="

              exit 0
            fi

            echo "Health indisponível - tentativa $i/30"

            sleep 5
          done

          echo ""
          echo "=============================================="
          echo " DEPLOY COM FALHA"
          echo "=============================================="
          echo "Health check não respondeu corretamente."
          echo ""

          echo "Logs do MailServer:"
          echo ""

          docker compose \
            --env-file .env \
            logs \
            --tail=150 \
            mailserver || true

          exit 1


      # ============================================================
      # REGISTRAR DEPLOY COM SUCESSO
      # ============================================================

      - name: Registrar versão implantada
        if: success()
        run: |
          set -e

          PREVIOUS_SHA="${{ steps.previous.outputs.previous_sha }}"

          if [ -n "$PREVIOUS_SHA" ]; then
            echo "$PREVIOUS_SHA" > "$DEPLOY_DIR/.previous-sha"
          fi

          echo "$GITHUB_SHA" > "$DEPLOY_DIR/.deployed-sha"

          echo ""
          echo "=============================================="
          echo "DEPLOY REGISTRADO"
          echo "=============================================="

          echo "Atual:"
          echo "$GITHUB_SHA"

          echo ""

          if [ -n "$PREVIOUS_SHA" ]; then
            echo "Anterior:"
            echo "$PREVIOUS_SHA"
          else
            echo "Anterior: nenhuma"
          fi

          echo "=============================================="


      # ============================================================
      # ROLLBACK AUTOMÁTICO
      # Só acontece se o container chegou a ser implantado
      # e algum passo posterior falhou.
      # ============================================================

      - name: Rollback automático
        if: failure() && steps.deployment.outcome == 'success'
        working-directory: /srv/aninfo/apps/AnInfo.MailServer
        run: |
          set -e

          PREVIOUS_SHA="${{ steps.previous.outputs.previous_sha }}"

          echo ""
          echo "=============================================="
          echo "ROLLBACK AUTOMÁTICO"
          echo "=============================================="

          if [ -z "$PREVIOUS_SHA" ]; then

            echo "Não existe versão anterior registrada."
            echo "Este é o primeiro deploy."
            echo ""
            echo "O container com falha será parado."

            MAILSERVER_IMAGE_TAG="$GITHUB_SHA" \
            docker compose \
              --env-file .env \
              stop mailserver || true

            exit 0

          fi

          echo "Versão anterior:"
          echo "$PREVIOUS_SHA"

          echo ""
          echo "Verificando imagem anterior..."

          if ! docker image inspect \
            "$IMAGE_NAME:$PREVIOUS_SHA" \
            > /dev/null 2>&1; then

            echo ""
            echo "ERRO:"
            echo "Imagem anterior não encontrada:"
            echo "$IMAGE_NAME:$PREVIOUS_SHA"

            exit 1
          fi

          echo "Imagem anterior encontrada."

          echo ""
          echo "Restaurando configuração anterior..."

          if [ -f "$DEPLOY_DIR/.rollback/docker-compose.yml" ]; then

            cp \
              "$DEPLOY_DIR/.rollback/docker-compose.yml" \
              "$DEPLOY_DIR/docker-compose.yml"

          fi

          echo ""
          echo "Retornando para:"
          echo "$IMAGE_NAME:$PREVIOUS_SHA"

          MAILSERVER_IMAGE_TAG="$PREVIOUS_SHA" \
          docker compose \
            --env-file .env \
            up -d \
            --no-build

          echo ""
          echo "Aguardando health da versão restaurada..."

          for i in $(seq 1 30); do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8085/health \
              > /dev/null; then

              echo ""
              echo "=============================================="
              echo "ROLLBACK CONCLUÍDO"
              echo "=============================================="
              echo "Versão restaurada:"
              echo "$PREVIOUS_SHA"
              echo "=============================================="

              exit 0
            fi

            echo "Tentativa de rollback $i/30..."

            sleep 5
          done

          echo ""
          echo "=============================================="
          echo "ERRO CRÍTICO"
          echo "=============================================="
          echo "A versão anterior também não respondeu."
          echo ""

          docker compose \
            --env-file .env \
            logs \
            --tail=150 \
            mailserver || true

          exit 1


      # ============================================================
      # STATUS FINAL
      # ============================================================

      - name: Status final
        if: always()
        working-directory: /srv/aninfo/apps/AnInfo.MailServer
        run: |
          echo ""
          echo "=============================================="
          echo "STATUS FINAL"
          echo "=============================================="

          echo ""
          echo "Containers:"

          docker compose \
            --env-file .env \
            ps || true

          echo ""
          echo "Imagens do AnInfo MailServer:"

          docker images "$IMAGE_NAME" \
            --format 'table {{.Repository}}\t{{.Tag}}\t{{.CreatedSince}}\t{{.Size}}' \
            || true

          echo ""
          echo "Versão registrada:"

          if [ -f "$DEPLOY_DIR/.deployed-sha" ]; then
            cat "$DEPLOY_DIR/.deployed-sha"
          else
            echo "Nenhuma."
          fi

          echo ""
          echo "=============================================="