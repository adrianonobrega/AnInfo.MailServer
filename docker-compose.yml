name: aninfo-mailserver

services:
  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: aninfo_mail
      POSTGRES_USER: aninfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env or the environment}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aninfo -d aninfo_mail"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    networks:
      - mailserver_private


  mailserver:
    build:
      context: .
      dockerfile: src/AnInfo.MailServer.Host/Dockerfile

    restart: unless-stopped

    environment:
      # PostgreSQL
      # O banco NÃO é acessado pelo Windows.
      # A comunicação acontece exclusivamente pela rede Docker.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=aninfo_mail;Username=aninfo;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"

      # SMTP Server
      SmtpServer__Host: 0.0.0.0
      SmtpServer__Port: 2525
      SmtpServer__RequireAuthentication: "false"
      SmtpServer__AllowInsecurePublicBind: "true"

      # Health Check
      Health__Url: http://0.0.0.0:8085

      # Delivery
      Delivery__Mode: ${DELIVERY_MODE:-Development}

      # SMTP Relay
      SmtpRelay__Host: ${SMTP_RELAY_HOST:-}
      SmtpRelay__Port: ${SMTP_RELAY_PORT:-587}
      SmtpRelay__Username: ${SMTP_RELAY_USERNAME:-}
      SmtpRelay__Password: ${SMTP_RELAY_PASSWORD:-}
      SmtpRelay__FromAddress: ${SMTP_RELAY_FROM_ADDRESS:-}
      SmtpRelay__FromName: ${SMTP_RELAY_FROM_NAME:-AnInfo Mail Server}
      SmtpRelay__UseStartTls: ${SMTP_RELAY_USE_STARTTLS:-true}
      SmtpRelay__UseSsl: ${SMTP_RELAY_USE_SSL:-false}
      SmtpRelay__PreserveOriginalFrom: ${SMTP_RELAY_PRESERVE_ORIGINAL_FROM:-false}
      SmtpRelay__TimeoutSeconds: ${SMTP_RELAY_TIMEOUT_SECONDS:-30}

    ports:
      # SMTP disponível somente no próprio notebook.
      - "127.0.0.1:${SMTP_HOST_PORT:-2525}:2525"

      # Health disponível somente no próprio notebook.
      - "127.0.0.1:${HEALTH_HOST_PORT:-8085}:8085"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - mailserver_private


networks:
  mailserver_private:
    driver: bridge


volumes:
  postgres_data: